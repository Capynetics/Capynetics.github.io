<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" type="image/png" href="{{ '/assets/favicon.ico' | relative_url }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: 'Page not found' }} | {{ site.title }}</title>
  <style>
    :root {
      --page-bg: #f7f4ed;
      --paper: #fffdf8;
      --text: #2d241c;
      --muted: #73685d;
      --line: #ddd2c4;
      --accent: #7c3aed;
      --shadow: 0 24px 70px rgba(59, 42, 26, 0.08);
    }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(186, 230, 253, 0.28), transparent 28%),
        linear-gradient(180deg, #fbf8f2 0%, var(--page-bg) 100%);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      width: min(680px, calc(100% - 32px));
      margin: 96px auto 48px;
    }

    .error-card {
      width: 100%;
      box-sizing: border-box;
      padding: clamp(2rem, 8vw, 4.5rem) clamp(1.5rem, 7vw, 4rem);
      text-align: center;
      background: var(--paper);
      border: 1px solid rgba(137, 119, 98, 0.14);
      box-shadow: var(--shadow);
    }

    .error-code {
      margin: 0;
      color: var(--accent);
      font-size: clamp(5rem, 22vw, 10rem);
      font-weight: 800;
      line-height: 0.85;
      letter-spacing: 0;
    }

    .error-card h2 {
      margin: 2rem 0 0.75rem;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      line-height: 1.15;
    }

    .error-card p {
      max-width: 34rem;
      margin: 0 auto;
      color: var(--muted);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.08rem;
      line-height: 1.65;
    }

    .home-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.7rem 1.1rem;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      background: var(--accent);
    }

    .home-link:hover,
    .home-link:focus-visible {
      background: #6330c2;
    }

    .home-link:focus-visible {
      outline: 3px solid #1e1914;
      outline-offset: 3px;
    }

    @media (max-width: 768px) {
      main {
        width: min(100% - 20px, 680px);
        margin: 28px auto;
      }
    }
  </style>
</head>
<body>

{% include new_navbar.html %}

<main aria-labelledby="error-title">
  <section class="error-card">
    <p class="error-code" aria-hidden="true">404</p>
    <h2 id="error-title">{{ page.title | default: 'Page not found' }}</h2>
    {{ content }}
    <a class="home-link" href="{{ '/' | relative_url }}">Return home</a>
  </section>
</main>

{% include new_footer.html %}

</body>
</html>
