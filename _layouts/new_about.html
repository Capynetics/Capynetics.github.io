<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" type="image/png" href="{{ site.url }}/assets/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    :root {
      --page-bg: #f7f4ed;
      --paper: #fffdf8;
      --text: #2d241c;
      --line: #ddd2c4;
      --accent: #7c3aed;
      --shadow: 0 24px 70px rgba(59, 42, 26, 0.08);
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      line-height: 1.7;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(186, 230, 253, 0.28), transparent 28%),
        linear-gradient(180deg, #fbf8f2 0%, var(--page-bg) 100%);
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      width: min(760px, calc(100% - 32px));
      margin: 96px auto 48px auto;
      padding: 32px;
      font-family: Georgia, 'Times New Roman', serif;
      background-color: var(--paper);
      border: 1px solid rgba(137, 119, 98, 0.14);
      box-shadow: var(--shadow);
    }

    .about-header {
      margin-bottom: 1.8rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--line);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #1e1914;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .about-content {
      font-size: 1.08rem;
    }

    .about-content > :first-child {
      margin-top: 0;
    }

    .about-content p,
    .about-content ul,
    .about-content ol,
    .about-content blockquote,
    .about-content pre,
    .about-content figure {
      margin-top: 0;
      margin-bottom: 1.35rem;
    }

    .about-content ul,
    .about-content ol {
      padding-left: 1.4rem;
    }

    .about-content li + li {
      margin-top: 0.4rem;
    }

    .about-content a {
      color: var(--accent);
      text-decoration: none;
    }

    .about-content a:hover {
      text-decoration: underline;
    }

    .about-content img {
      max-width: 100%;
      height: auto;
      border-radius: 14px;
    }

    .about-embed {
      margin: 1.4rem 0 1.8rem;
      display: flex;
      justify-content: center;
    }

    .scene-shell {
      width: min(72vw, 420px);
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.08);
      background: #e9e9e9;
      touch-action: none;
      user-select: none;
    }

    .scene-shell canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 72px;
        margin-bottom: 28px;
        padding: 22px 16px;
        width: calc(100% - 20px);
        box-sizing: border-box;
      }

      h1 {
        font-size: 2.1rem;
        word-wrap: break-word;
      }

      body, html {
        overflow-x: hidden;
      }
    }
  </style>
</head>
<body>

{% include new_navbar.html %}

<main class="container" aria-labelledby="about-title">
  <header class="about-header">
    <h1 id="about-title">{{ page.title }}</h1>
  </header>
  <div class="about-embed">
    <div class="scene-shell" id="about-scene-shell"></div>
  </div>
  <article class="about-content">
    {{ content }}
  </article>
</main>

{% include new_footer.html %}

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.179.1/build/three.module.js"
    }
  }
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'https://unpkg.com/three@0.179.1/examples/jsm/loaders/GLTFLoader.js';

  const container = document.getElementById('about-scene-shell');
  if (!container) {
    throw new Error('About scene container not found');
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9e9e9);

  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
  camera.position.set(0, 1.5, 4);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(ambient);

  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(3, 4, 3);
  scene.add(dir);

  const mouseWorld = new THREE.Vector3(0, 0, 1);
  const raycaster = new THREE.Raycaster();
  const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

  function updatePointerTarget(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((clientY - rect.top) / rect.height) * 2 + 1;
    const pointer = new THREE.Vector2(x, y);
    raycaster.setFromCamera(pointer, camera);
    raycaster.ray.intersectPlane(interactionPlane, mouseWorld);
  }

  let model = null;
  const loader = new GLTFLoader();

  loader.load(
    '{{ "/mid_me_n_glasses3.glb" | relative_url }}',
    (gltf) => {
      model = gltf.scene;
      model.position.set(0, 0, 0);
      model.scale.set(1, 1, 1);
      scene.add(model);

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      model.position.z = -2;

      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      const distance = maxDim / (2 * Math.tan(fov / 2));
      camera.position.set(0, 0.1, distance);
      camera.lookAt(0, 0, 0);
    },
    undefined,
    (err) => {
      console.error(err);
    }
  );

  const handlePointerMove = (event) => {
    const clientX = event.touches && event.touches.length ? event.touches[0].clientX : event.clientX;
    const clientY = event.touches && event.touches.length ? event.touches[0].clientY : event.clientY;
    updatePointerTarget(clientX, clientY);
  };

  container.addEventListener('pointermove', (event) => {
    event.preventDefault();
    handlePointerMove(event);
  });

  container.addEventListener('touchmove', (event) => {
    if (event.touches.length) {
      event.preventDefault();
      handlePointerMove(event);
    }
  }, { passive: false });

  window.addEventListener('mousemove', (event) => {
    updatePointerTarget(event.clientX, event.clientY);
  });

  function animate() {
    requestAnimationFrame(animate);
    if (model) {
      const targetQuat = new THREE.Quaternion();
      const tempObj = new THREE.Object3D();
      tempObj.position.copy(model.position);
      tempObj.lookAt(mouseWorld);
      targetQuat.copy(tempObj.quaternion);
      model.quaternion.slerp(targetQuat, 0.06);
    }
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    const size = Math.min(container.clientWidth, container.clientHeight);
    renderer.setSize(size, size);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  });
</script>

</body>
</html>
