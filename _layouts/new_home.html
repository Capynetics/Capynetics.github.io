<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" type="image/png" href="assets/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capynetics</title>
    <meta name="description" content="{{ page.description }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:image" content="{{ page.image }}">
    <meta property="og:url" content="{{ page.url }}">
    <link rel="stylesheet" href="/index.css">
</head>
<body>

{% include new_navbar.html %}

<section class="hero" aria-label="Main banner">
    <div id="hero-canvas" class="hero-canvas" aria-hidden="true"></div>
    <img src="assets/logo.png" alt="Capynetics Logo"> 
    <h1>Explore, Build, Share</h1>
    <div class="hero-arrow" aria-hidden="true">
        <span>↓</span>
    </div>
</section>

<div id="posts" class="container">
    {% for post in site.posts %}
    <div class="thumb">
        <a href="{{ post.url }}">
            <div class="image" style="background-image:url('{{ post.image }}')"></div>
            <h2>{{ post.title }}</h2>
        </a>
    </div>
    {% endfor %}
</div>

{% include new_footer.html %}

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script src="/index.js"></script>

</body>
</html>
